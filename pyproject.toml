[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streetosolver"
version = "0.1.0"
description = ""
requires-python = "==3.12.*"
dependencies = [
    "loguru==0.7.3",
    "ortools==9.15.6755",
    "pillow==12.3.0",
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.4",
    "ty==0.0.79",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.12"
